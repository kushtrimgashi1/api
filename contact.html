<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Contact VidRidge</title>
<meta name="description" content="Found a bug, a video that will not download, or want another platform supported? Write to us — we read every message.">
<script type="module" src="/i18n.js"></script>
<style>
  :root{--bg:#f7f5f1;--card:#fff;--fg:#14110e;--muted:#8a857d;--border:#e7e2d8;--accent:#e11d24;--soft:#f1ede4;--ok:#0f7b47;--err:#b91c1c}
  @media (prefers-color-scheme:dark){:root{--bg:#0e0d0b;--card:#171512;--fg:#f5f2ea;--muted:#9b958a;--border:#2a271f;--accent:#f87171;--soft:#1f1c17;--ok:#4ade80;--err:#fca5a5}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.65}
  .wrap{max-width:720px;margin:0 auto;padding:18px 18px 56px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 22px;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;letter-spacing:-.02em;text-decoration:none;color:var(--fg)}
  .logo .mark{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:15px;font-weight:800}
  .nav{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .nav a{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-decoration:none;font-weight:700}
  .nav a:hover,.nav a[aria-current]{color:var(--fg)}
  select{border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:10px;padding:7px;font-size:12px;font-family:inherit;max-width:120px}
  h1{font-size:30px;line-height:1.15;letter-spacing:-.03em;margin:8px 0 14px;font-weight:800}
  .lead{font-size:15px;color:var(--muted);margin:0 0 26px}
  form{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px}
  label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--muted);margin:0 0 6px}
  .field{margin-bottom:16px}
  input[type=text],input[type=email],textarea{width:100%;border:1px solid var(--border);background:var(--bg);color:var(--fg);border-radius:11px;padding:11px 12px;font-size:14px;font-family:inherit;line-height:1.5}
  textarea{min-height:132px;resize:vertical}
  input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
  button{width:100%;border:0;border-radius:11px;background:var(--accent);color:#fff;font-family:inherit;font-size:14px;font-weight:800;letter-spacing:.02em;padding:13px;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  .msg{margin:14px 0 0;font-size:13px;min-height:1.2em}
  .msg.ok{color:var(--ok)}
  .msg.err{color:var(--err)}
  .msg a{color:inherit;font-weight:700}
  .direct{margin-top:22px;font-size:13px;color:var(--muted)}
  .direct a{color:var(--fg);font-weight:700}
  footer{margin-top:34px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  footer a{color:var(--muted);text-decoration:none}
  footer a:hover{color:var(--fg)}
  [dir=rtl] .nav a,[dir=rtl] h1,[dir=rtl] label{letter-spacing:0}
</style>
</head>
<body data-page="doc">
<div class="wrap">
  <header>
    <a class="logo" href="/__LANG__/"><span class="mark">&#8615;</span> VidRidge</a>
    <div class="nav">
      <a href="/__LANG__/about" data-i18n="nav.about">About</a>
      <a href="/__LANG__/privacy" data-i18n="nav.privacy">Privacy</a>
      <a href="/__LANG__/terms" data-i18n="nav.terms">Terms</a>
      <a aria-current="page" href="/__LANG__/contact" data-i18n="nav.contact">Contact</a>
      <select id="langSelect" aria-label="Language" data-i18n-aria="nav.lang"></select>
    </div>
  </header>
  <main>
    <h1 data-i18n="contact.h1">Contact us</h1>
    <p class="lead" data-i18n="contact.lead">Found a bug, a video that will not download, or want another platform supported? Write to us — we read every message.</p>
    <form id="contactForm" novalidate>
      <div class="field">
        <label for="cName" data-i18n="contact.name">Your name</label>
        <input id="cName" name="name" type="text" maxlength="80" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="cEmail" data-i18n="contact.email">Your email</label>
        <input id="cEmail" name="email" type="email" maxlength="120" autocomplete="email" dir="ltr" placeholder="you@example.com" data-i18n-ph="contact.phEmail" required>
      </div>
      <div class="field">
        <label for="cMessage" data-i18n="contact.message">Message</label>
        <textarea id="cMessage" name="message" maxlength="2000" placeholder="Tell us what happened..." data-i18n-ph="contact.phMessage" required></textarea>
      </div>
      <div class="hp" aria-hidden="true">
        <label for="cWebsite">Website</label>
        <input id="cWebsite" name="website" type="text" tabindex="-1" autocomplete="off">
      </div>
      <button id="cSend" type="submit" data-i18n="contact.send">Send message</button>
      <p class="msg" id="cMsg" role="status" aria-live="polite"></p>
    </form>
    <p class="direct"><span data-i18n="contact.direct">Or email us directly:</span> <a href="mailto:hello@vidridge.com" dir="ltr">hello@vidridge.com</a></p>
  </main>
  <footer>
    <a href="/__LANG__/" data-i18n="watch.back">&larr; Back</a>
    <span>VidRidge &middot; vidridge.com</span>
  </footer>
</div>
<script>
(function () {
  'use strict';
  var form = document.getElementById('contactForm');
  var btn = document.getElementById('cSend');
  var out = document.getElementById('cMsg');
  var FALLBACK = {
    'contact.send': 'Send message',
    'contact.sending': 'Sending...',
    'contact.ok': 'Message sent. We usually reply within 1–2 days.',
    'contact.err': 'Could not send the message. Please try again or email us directly.',
    'contact.fallback': 'The form is temporarily unavailable.'
  };
  var t = function (k) {
    if (window.VRI18N) return window.VRI18N.t(k);
    return FALLBACK[k] || k;
  };
  function say(key, cls) {
    out.textContent = t(key);
    out.className = 'msg' + (cls ? ' ' + cls : '');
  }
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    var data = {
      name: document.getElementById('cName').value.trim(),
      email: document.getElementById('cEmail').value.trim(),
      message: document.getElementById('cMessage').value.trim(),
      website: document.getElementById('cWebsite').value
    };
    if (!data.name || !data.email || !data.message) {
      say('contact.err', 'err');
      return;
    }
    btn.disabled = true;
    say('contact.sending');
    try {
      var res = await fetch('/api/contact', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(data)
      });
      var body = await res.json().catch(function () { return {}; });
      if (res.ok && body && body.ok) {
        say('contact.ok', 'ok');
        form.reset();
      } else {
        if (body && body.error === 'not_configured') say('contact.fallback', 'err');
        else say('contact.err', 'err');
        offerMailto(data);
      }
    } catch (err) {
      say('contact.err', 'err');
      offerMailto(data);
    } finally {
      btn.disabled = false;
    }
  });

  // The form always stays usable: if delivery is not wired up, hand the
  // message to the visitor's own mail app instead of losing it.
  function offerMailto(data) {
    if (document.getElementById('cMailto')) return;
    var href = 'mailto:hello@vidridge.com'
      + '?subject=' + encodeURIComponent('VidRidge contact — ' + (data.name || ''))
      + '&body=' + encodeURIComponent((data.message || '') + '\n\n— ' + (data.name || '') + ' <' + (data.email || '') + '>');
    var a = document.createElement('a');
    a.id = 'cMailto';
    a.href = href;
    a.className = 'mailto';
    a.textContent = 'hello@vidridge.com';
    out.appendChild(document.createTextNode(' '));
    out.appendChild(a);
  }
})();
</script>
</body>
</html>
