<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SaveVid — Shiko videon</title>
<style>
  :root{--bg:#f7f5f1;--card:#fff;--fg:#14110e;--muted:#8a857d;--border:#e7e2d8;--accent:#e11d24;--soft:#f1ede4}
  @media (prefers-color-scheme:dark){:root{--bg:#0e0d0b;--card:#171512;--fg:#f5f2ea;--muted:#9b958a;--border:#2a271f;--accent:#f87171;--soft:#1f1c17}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:680px;margin:0 auto;padding:18px 16px 48px}
  header{display:flex;align-items:center;justify-content:space-between;padding:10px 0 20px}
  .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;letter-spacing:-.02em;text-decoration:none;color:var(--fg)}
  .logo .mark{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:15px;font-weight:800}
  .back{font-size:13px;color:var(--muted);text-decoration:none;border:1px solid var(--border);padding:8px 12px;border-radius:10px;transition:color .15s}
  .back:hover{color:var(--fg)}
  .player{position:relative;width:100%;aspect-ratio:9/16;max-height:68vh;background:#000;border-radius:18px;overflow:hidden;border:1px solid var(--border)}
  .player video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
  .card{margin-top:18px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px}
  .badge{display:inline-block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);padding:4px 9px;border-radius:999px}
  h1{font-size:18px;line-height:1.3;margin:10px 0 4px;font-weight:800;letter-spacing:-.02em;word-break:break-word}
  .sub{font-size:13px;color:var(--muted);margin:0;word-break:break-word}
  .actions{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-top:14px}
  .btn{height:46px;border-radius:12px;border:0;cursor:pointer;font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,opacity .15s}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.65;cursor:default}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-ghost{background:var(--soft);color:var(--fg);border:1px solid var(--border);padding:0 16px}
  .btn-icon{background:var(--soft);color:var(--muted);border:1px solid var(--border);width:46px}
  .btn-mp3{width:100%;margin-top:8px;background:transparent;color:var(--accent);border:1px solid var(--accent);height:44px}
  .btn-new{width:100%;margin-top:10px;height:40px;background:transparent;border:0;color:var(--muted);text-decoration:none;font-size:11px;letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;border-radius:10px}
  .btn-new:hover{color:var(--fg)}
  .progress{margin-top:12px;display:none}
  .bar{height:6px;background:var(--border);border-radius:999px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
  .ptxt{font-size:11px;color:var(--muted);margin:7px 0 0}
  .msg{font-size:12px;color:var(--accent);margin-top:10px;display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="index.html"><span class="mark">&#8615;</span> SaveVid</a>
    <a class="back" href="index.html">&larr; Kthehu</a>
  </header>

  <div class="player">
    <video id="vid" controls playsinline autoplay preload="metadata"></video>
  </div>

  <div class="card">
    <span id="badge" class="badge">Video</span>
    <h1 id="title">Video</h1>
    <p id="sub" class="sub"></p>

    <div class="actions">
      <button id="hd" class="btn btn-primary">&#8615; Shkarko HD</button>
      <button id="sd" class="btn btn-ghost">SD</button>
      <button id="open" class="btn btn-icon" title="Hap burimin">&#8599;</button>
    </div>
    <button id="mp3" class="btn btn-mp3">&#9834; Shkarko MP3 (Audio)</button>
    <a href="index.html" class="btn btn-new">&#8634; Shkarko nj&euml; video tjet&euml;r</a>

    <div id="prog" class="progress">
      <div class="bar"><i id="bar"></i></div>
      <p id="ptxt" class="ptxt"></p>
    </div>
    <p id="msg" class="msg"></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const hdUrl = q.get('u') || '';
  const sdUrl = q.get('sd') || hdUrl;
  const titleTxt = q.get('t') || 'Video';
  const authorTxt = q.get('a') || '';
  const platformTxt = q.get('p') || '';
  const sourceTxt = q.get('s') || '';

  const vid = document.getElementById('vid');
  const titleEl = document.getElementById('title');
  const badgeEl = document.getElementById('badge');
  const subEl = document.getElementById('sub');
  const prog = document.getElementById('prog');
  const bar = document.getElementById('bar');
  const ptxt = document.getElementById('ptxt');
  const msg = document.getElementById('msg');
  const hdBtn = document.getElementById('hd');
  const sdBtn = document.getElementById('sd');
  const mp3Btn = document.getElementById('mp3');

  vid.src = hdUrl;
  titleEl.textContent = titleTxt;
  badgeEl.textContent = platformTxt || 'Video';
  subEl.textContent = [authorTxt ? '@' + authorTxt : '', sourceTxt].filter(Boolean).join(' • ');

  function showProgress(show) {
    prog.style.display = show ? 'block' : 'none';
    if (!show) { bar.style.width = '0%'; ptxt.textContent = ''; }
  }
  function showMsg(text) {
    if (!text) { msg.style.display = 'none'; return; }
    msg.textContent = text;
    msg.style.display = 'block';
  }
  function saveBlobAs(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 20000);
  }

  async function fetchBlob(url) {
    const res = await fetch(url, { mode: 'cors', credentials: 'omit', referrerPolicy: 'no-referrer' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const ct = (res.headers.get('content-type') || '').toLowerCase();
    if (ct.includes('text/html') || ct.includes('application/json')) throw new Error('Jo-video');
    const total = Number(res.headers.get('content-length') || 0);
    if (!res.body) return await res.blob();
    const reader = res.body.getReader();
    const chunks = [];
    let received = 0;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      received += value.length;
      if (total > 0) {
        const pct = Math.min(100, Math.round((received / total) * 100));
        bar.style.width = pct + '%';
        ptxt.textContent = 'Duke shkarkuar... ' + pct + '% (' + (received / 1048576).toFixed(1) + ' / ' + (total / 1048576).toFixed(1) + ' MB)';
      } else {
        bar.style.width = '90%';
        ptxt.textContent = 'Duke shkarkuar... ' + (received / 1048576).toFixed(1) + ' MB';
      }
    }
    return new Blob(chunks, { type: ct.includes('mp4') || !ct ? 'video/mp4' : ct });
  }

  async function getBlob(url) {
    try {
      ptxt.textContent = 'Duke u lidhur drejt CDN...';
      return await fetchBlob(url);
    } catch (e) {
      ptxt.textContent = 'Duke u lidhur përmes serverit...';
      return await fetchBlob('/api/extract?proxy=1&url=' + encodeURIComponent(url));
    }
  }

  async function download(url, btn, label) {
    if (!url) return;
    const orig = btn.innerHTML;
    btn.disabled = true;
    btn.textContent = 'Duke shkarkuar ' + label + '...';
    showMsg('');
    showProgress(true);
    try {
      const blob = await getBlob(url);
      saveBlobAs(blob, 'savevid_' + label + '_' + Date.now() + '.mp4');
      bar.style.width = '100%';
      ptxt.textContent = 'Përfundoi';
      btn.textContent = '✓ U shkarkua ' + label + '!';
      setTimeout(() => { btn.innerHTML = orig; btn.disabled = false; showProgress(false); }, 3000);
    } catch (e) {
      btn.innerHTML = orig;
      btn.disabled = false;
      showProgress(false);
      showMsg('Shkarkimi dështoi. Provo butonin ↗ për ta hapur direkt.');
    }
  }

  function floatTo16(f32) {
    const out = new Int16Array(f32.length);
    for (let i = 0; i < f32.length; i++) {
      const s = Math.max(-1, Math.min(1, f32[i]));
      out[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
    }
    return out;
  }

  function encodeMp3(audioBuffer, onProgress) {
    const channels = Math.min(2, audioBuffer.numberOfChannels);
    const enc = new lamejs.Mp3Encoder(channels, audioBuffer.sampleRate, 192);
    const left = floatTo16(audioBuffer.getChannelData(0));
    const right = channels > 1 ? floatTo16(audioBuffer.getChannelData(1)) : null;
    const block = 1152;
    const chunks = [];
    const total = left.length;
    for (let i = 0; i < total; i += block) {
      const l = left.subarray(i, i + block);
      const buf = channels > 1 ? enc.encodeBuffer(l, right.subarray(i, i + block)) : enc.encodeBuffer(l);
      if (buf.length > 0) chunks.push(new Int8Array(buf));
      if (onProgress && i % (block * 200) === 0) onProgress(Math.min(100, Math.round((i / total) * 100)));
    }
    const end = enc.flush();
    if (end.length > 0) chunks.push(new Int8Array(end));
    return new Blob(chunks, { type: 'audio/mpeg' });
  }

  mp3Btn.onclick = async () => {
    if (!hdUrl) return;
    const orig = mp3Btn.innerHTML;
    mp3Btn.disabled = true;
    mp3Btn.textContent = 'Duke konvertuar në MP3...';
    showMsg('');
    showProgress(true);
    bar.style.width = '0%';
    ptxt.textContent = 'Duke shkarkuar audion...';
    try {
      if (!window.lamejs) throw new Error('Libraria MP3 nuk u ngarkua.');
      const mp4Blob = await getBlob(hdUrl);
      ptxt.textContent = 'Duke nxjerrë audion dhe duke konvertuar në MP3...';
      bar.style.width = '40%';
      await new Promise(r => setTimeout(r, 60));
      const arrayBuffer = await mp4Blob.arrayBuffer();
      const AC = window.AudioContext || window.webkitAudioContext;
      const ctx = new AC();
      if (ctx.state === 'suspended' && ctx.resume) { try { await ctx.resume(); } catch (e) {} }
      let audioBuffer;
      try { audioBuffer = await Promise.race([
        ctx.decodeAudioData(arrayBuffer),
        new Promise((_, rej) => setTimeout(() => rej(new Error('Dekodimi i audios zgjati shumë.')), 25000))
      ]); }
      finally { if (ctx.close) ctx.close(); }
      bar.style.width = '55%';
      const mp3Blob = encodeMp3(audioBuffer, (p) => {
        bar.style.width = (55 + Math.round(p * 0.45)) + '%';
        ptxt.textContent = 'Duke konvertuar në MP3... ' + p + '%';
      });
      saveBlobAs(mp3Blob, 'savevid_audio_' + Date.now() + '.mp3');
      bar.style.width = '100%';
      ptxt.textContent = 'MP3 u shkarkua me sukses!';
      mp3Btn.textContent = '✓ MP3 u shkarkua!';
      setTimeout(() => { mp3Btn.innerHTML = orig; mp3Btn.disabled = false; showProgress(false); }, 3000);
    } catch (e) {
      mp3Btn.innerHTML = orig;
      mp3Btn.disabled = false;
      showProgress(false);
      showMsg('Konvertimi në MP3 dështoi: ' + (e.message || 'provo një video tjetër.'));
    }
  };

  hdBtn.onclick = () => download(hdUrl, hdBtn, 'HD');
  sdBtn.onclick = () => download(sdUrl, sdBtn, 'SD');
  document.getElementById('open').onclick = () => { if (hdUrl) window.open(hdUrl, '_blank', 'noopener'); };

  if (!hdUrl) {
    showMsg('Nuk u gjet video. Kthehu dhe provo një link tjetër.');
    vid.style.display = 'none';
  }
</script>
</body>
</html>
