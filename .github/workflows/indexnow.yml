name: IndexNow ping

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the Cloudflare deploy
        run: sleep 120

      - name: Submit all language URLs to IndexNow (Bing, Yandex, DuckDuckGo)
        run: |
          set -e
          PAYLOAD='{"host":"vidridge.com","key":"084e6597c5a3d36a699c36eee83504ba","keyLocation":"https://vidridge.com/084e6597c5a3d36a699c36eee83504ba.txt","urlList":["https://vidridge.com/en/","https://vidridge.com/sq/","https://vidridge.com/it/","https://vidridge.com/de/","https://vidridge.com/fr/","https://vidridge.com/es/","https://vidridge.com/pt/","https://vidridge.com/tr/","https://vidridge.com/ar/"]}'
          for url in https://api.indexnow.org/indexnow https://www.bing.com/indexnow; do
            code=$(curl -sS -o /tmp/out.txt -w "%{http_code}" -X POST "$url" \
              -H "Content-Type: application/json; charset=utf-8" \
              --data "$PAYLOAD")
            echo "$url -> HTTP $code"
            cat /tmp/out.txt || true
            echo
            if [ "$code" = "200" ] || [ "$code" = "202" ]; then exit 0; fi
          done
          echo "IndexNow did not accept the submission (rate limited or key not live yet)"; exit 1
