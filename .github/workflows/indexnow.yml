name: IndexNow ping

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the Cloudflare deploy
        run: sleep 120

      - name: Submit all URLs to IndexNow (Bing, Yandex, DuckDuckGo)
        run: |
          set -e
          URLS=""
          for lang in en sq it de fr es pt tr ar; do
            for page in "" "/about" "/privacy" "/terms" "/contact"; do
              if [ -z "$URLS" ]; then URLS="\"https://vidridge.com/$lang$page\""; else URLS="$URLS,\"https://vidridge.com/$lang$page\""; fi
            done
          done
          PAYLOAD="{\"host\":\"vidridge.com\",\"key\":\"084e6597c5a3d36a699c36eee83504ba\",\"keyLocation\":\"https://vidridge.com/084e6597c5a3d36a699c36eee83504ba.txt\",\"urlList\":[$URLS]}"
          echo "Submitting: $(echo "$PAYLOAD" | grep -o 'https://' | wc -l) URLs"
          for url in https://api.indexnow.org/indexnow https://www.bing.com/indexnow; do
            code=$(curl -sS -o /tmp/out.txt -w "%{http_code}" -X POST "$url" \
              -H "Content-Type: application/json; charset=utf-8" \
              --data "$PAYLOAD")
            echo "$url -> HTTP $code"
            cat /tmp/out.txt || true
            echo
            if [ "$code" = "200" ] || [ "$code" = "202" ]; then exit 0; fi
          done
          echo "IndexNow did not accept the submission (rate limited or key not live yet)"; exit 1
