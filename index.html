<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SaveVid V50 • Server Backend</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fragment+Mono&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #fcfcf9; --fg: #0a0a0a; --muted: #6b6b6b; --border: #e8e6e1; --card: #ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0e0e0e; --fg: #f5f5f0; --muted: #9a9a9a; --border: #232323; --card: #161616; } }
    body { font-family: "Fragment Mono", monospace; background-color: var(--bg); color: var(--fg); margin: 0; }
    h1, h2, .serif { font-family: "Instrument Serif", serif; }
  </style>
</head>
<body class="min-h-screen selection:bg-black selection:text-white">
  <div class="w-full max-w-[520px] mx-auto min-h-screen flex flex-col px-5 pb-10 pt-6">
    <header class="flex items-center justify-between mb-6">
      <div class="flex items-baseline gap-2">
        <h1 class="text-[28px] tracking-[-0.02em] font-normal leading-none">SaveVid</h1>
        <span class="text-[11px] px-2 py-[3px] rounded-full border border-[var(--border)] bg-black text-white dark:bg-white dark:text-black tracking-widest uppercase">V50</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="h-2 w-2 rounded-full bg-[#00d26a] animate-pulse"></span>
        <span class="text-[10px] uppercase tracking-widest text-[var(--muted)]">Vercel Backend</span>
      </div>
    </header>

    <div class="mb-6">
      <h2 class="serif text-[40px] leading-[0.95] tracking-[-0.03em] mb-2">Shkarko <span class="italic">pa</span><br>watermark.</h2>
      <p class="text-[12px] leading-[1.5] text-[var(--muted)]">Instagram Reels, TikTok & Facebook (HD & SD).</p>
    </div>

    <div class="bg-[var(--card)] border border-[var(--border)] rounded-[18px] p-[14px] shadow-[0_10px_30px_-18px_rgba(0,0,0,0.3)]">
      <div class="flex items-center gap-2 mb-3 px-1">
        <span class="text-[10px] uppercase tracking-widest text-[var(--muted)]">Linku i Videos</span>
        <div class="h-px flex-1 bg-[var(--border)]"></div>
        <button id="pasteBtn" class="text-[10px] uppercase tracking-widest underline underline-offset-4 hover:opacity-60">Ngjit (Paste)</button>
      </div>

      <div class="relative">
        <input id="urlInput" type="text" placeholder="Ngjit çdo link (IG, FB Share, TikTok)..." 
          class="w-full h-[54px] rounded-[12px] bg-[#f5f4ef] dark:bg-[#1e1e1e] border border-transparent focus:border-black dark:focus:border-white focus:outline-none px-4 pr-[54px] text-[13px] placeholder:text-[#b0aea8]">
        <button id="clearBtn" class="absolute right-[6px] top-[6px] bottom-[6px] w-[42px] rounded-[9px] bg-white dark:bg-black border border-[var(--border)] grid place-items-center text-[12px]">✕</button>
      </div>

      <button id="downloadBtn" class="mt-3 w-full h-[52px] rounded-[12px] bg-[var(--fg)] text-[var(--bg)] text-[13px] uppercase tracking-[0.16em] font-medium hover:opacity-[0.9] active:scale-[0.99] transition-all flex items-center justify-center gap-2">
        <span>Gjej Videon</span>
      </button>
    </div>

    <div id="progressBox" class="hidden mt-5 border border-[var(--border)] rounded-[14px] bg-[var(--card)] p-4">
      <div class="flex items-center justify-between mb-3">
        <span class="text-[10px] uppercase tracking-[0.14em] text-[var(--muted)]">Progresi</span>
        <span id="progressStatus" class="text-[10px] text-[var(--muted)] animate-pulse">Duke u lidhur me serverin Vercel...</span>
      </div>
    </div>

    <div id="errorBox" class="hidden mt-5 rounded-[14px] border border-[#ffd1d1] bg-[#fff3f3] dark:bg-[#1f1212] p-4">
      <p id="errorText" class="text-[12px] leading-[1.5] text-[#7a1f1f]"></p>
    </div>

    <div id="resultBox" class="hidden mt-5 rounded-[18px] border border-[var(--border)] bg-[var(--card)] overflow-hidden shadow-[0_20px_50px_-24px_rgba(0,0,0,0.4)]">
      <div class="relative bg-black aspect-[9/12] max-h-[440px] overflow-hidden">
        <video id="videoPreview" controls playsinline class="relative w-full h-full object-contain"></video>
      </div>
      <div class="p-4">
        <div class="grid grid-cols-2 gap-3 mb-2">
          <button id="dlHdBtn" class="h-[48px] rounded-[12px] bg-black text-white dark:bg-white dark:text-black grid place-items-center text-[12px] uppercase tracking-[0.12em] font-medium">Shkarko HD</button>
          <button id="dlSdBtn" class="h-[48px] rounded-[12px] border border-[var(--border)] bg-[#f7f7f5] dark:bg-[#1e1e1e] grid place-items-center text-[12px] uppercase tracking-[0.12em] font-medium">Shkarko SD</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const urlInput = document.getElementById('urlInput');
    const progressBox = document.getElementById('progressBox');
    const progressStatus = document.getElementById('progressStatus');
    const errorBox = document.getElementById('errorBox');
    const errorText = document.getElementById('errorText');
    const resultBox = document.getElementById('resultBox');
    const videoPreview = document.getElementById('videoPreview');
    const dlHdBtn = document.getElementById('dlHdBtn');
    const dlSdBtn = document.getElementById('dlSdBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    let currentVideoData = null;

    document.getElementById('pasteBtn').onclick = async () => { try { urlInput.value = await navigator.clipboard.readText(); } catch (e) {} };
    document.getElementById('clearBtn').onclick = () => { urlInput.value = ''; errorBox.classList.add('hidden'); resultBox.classList.add('hidden'); progressBox.classList.add('hidden'); };

    async function downloadFile(videoUrl, btn, label) {
      const orig = btn.textContent;
      btn.textContent = 'Duke shkarkuar...';
      btn.disabled = true;

      const proxyUrl = `/api/extract?proxy=1&url=${encodeURIComponent(videoUrl)}`;
      const a = document.createElement('a');
      a.href = proxyUrl;
      a.download = `savevid_${label}_${Date.now()}.mp4`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 3000);
    }

    downloadBtn.onclick = async () => {
      let url = urlInput.value.trim();
      if (!url) return;
      if (!url.startsWith('http')) url = 'https://' + url;

      errorBox.classList.add('hidden');
      resultBox.classList.add('hidden');
      progressBox.classList.remove('hidden');
      progressStatus.textContent = 'Duke procesuar në Vercel...';
      downloadBtn.disabled = true;

      try {
        const res = await fetch(`/api/extract?url=${encodeURIComponent(url)}`);
        const json = await res.json();
        if (!res.ok || !json.hd) throw new Error(json.error || 'Videoja nuk u gjet.');

        currentVideoData = json;
        videoPreview.src = json.hd;
        progressBox.classList.add('hidden');
        resultBox.classList.remove('hidden');
      } catch (err) {
        progressStatus.textContent = 'Gabim';
        errorText.textContent = err.message;
        errorBox.classList.add('hidden');
      } finally {
        downloadBtn.disabled = false;
      }
    };

    dlHdBtn.onclick = () => { if (currentVideoData?.hd) downloadFile(currentVideoData.hd, dlHdBtn, 'HD'); };
    dlSdBtn.onclick = () => { if (currentVideoData?.sd || currentVideoData?.hd) downloadFile(currentVideoData.sd || currentVideoData.hd, dlSdBtn, 'SD'); };
  </script>
</body>
</html>
